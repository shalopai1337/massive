<!doctype html>
<html lang='ru'>
	<head>
		<meta charset="utf-8">
	</head>
	<body>
		<form id='interface'>
			<input type='text' id='textObj'>
			<button type='button' id='btn'>Ввод</button>
			<div id='output' class='output-box'>Здесь будет результат</div>
		</form>
		<script>
			'use strict';

			let allInterface = document.getElementById('interface');
			let inputElement = document.getElementById('textObj');

			let resultOfInput = document.getElementById('output');
			
			function camelize(inputString) { 	
				let arr = inputString.split('-');
				let resultArr = [];
				resultArr.push(arr[0]);
				for (let key = 1;key < arr.length; key++) {
					resultArr.push(arr[key][0].toUpperCase() + arr[key].slice(1));
				}
				let str = resultArr.join('');
				return str;
			}

			btn.onclick = function() {
				resultOfInput.textContent = camelize(inputElement.value);
			}
		</script>
	</body>
</html>
