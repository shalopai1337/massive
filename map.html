<!doctype html>
<html lang='ru'>
	<head>
		<meta charset='utf-8'>
	</head>
	<body>
		<input type='text' id='textInput' placeholder='Введите слово'>
		<p id='output'>Здесь будет результат</p>
		<button type='button' id='addBtn'>Добавить</button>
		<button type='button' id='resBtn'>Итог</button>
		<button type='button' id='clear'>Очистить</button>
		<script>
			'use strict';
			let textInput = document.getElementById('textInput');
			let output = document.getElementById('output');
			let addBtn = document.getElementById('addBtn');
			let resBtn = document.getElementById('resBtn');
			let clear = document.getElementById('clear');
			let arr = [];

			function unique(arr) {
				let jar = new Set(arr);
				let resArr = [...jar].join(', ');
				output.textContent = resArr;
				return resArr;
			}

			addBtn.onclick = function() {
				if (textInput.value != '') {
					arr.push(textInput.value);
					textInput.value = '';
				}
			}

			resBtn.onclick = function() {
				unique(arr);
			}

			clear.onclick = function() {
				arr.splice(0, arr.length);
				output.textContent = '';
			}
		</script>
	</body>
</html>
